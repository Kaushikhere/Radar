name: Download test

# Phase 0 gate: can a GitHub-hosted runner fetch from the exchanges?
# Runs daily for a while, since a block may come and go, and on any change
# to the test itself. Scheduled runs only happen on the default branch.

on:
  schedule:
    - cron: "30 13 * * 1-5" # 19:00 IST on weekdays, after the day's files are out
  workflow_dispatch:
  push:
    paths:
      - scripts/download_test.py
      - .github/workflows/download-test.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Every probe runs even if an earlier one fails, so one run answers all three.
      - name: NSE daily price file
        if: always()
        run: python scripts/download_test.py bhavcopy

      - name: NSE results list with filing dates
        if: always()
        run: python scripts/download_test.py results

      - name: BSE reachable
        if: always()
        run: python scripts/download_test.py bse
